<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Car Racing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <h1>Mini Car Racing Game</h1>

        <div class="score-board">
            <div>
                <span>Score</span>
                <strong>1200</strong>
            </div>

            <div>
                <span>Speed</span>
                <strong>80 km/h</strong>
            </div>

            <div>
                <span>Level</span>
                <strong>2</strong>
            </div>
        </div>

        <div class="road">

            <div class="road-line line1"></div>
            <div class="road-line line2"></div>
            <div class="road-line line3"></div>
            <div class="road-line line4"></div>

            <div class="enemy enemy1">🚗</div>
            <div class="enemy enemy2">🚙</div>
            <div class="enemy enemy3">🚘</div>

            <div class="player">🏎️</div>

        </div>

        <div class="instructions">
            <p>Move your car and avoid the enemy cars!</p>
        </div>

        <button class="start-btn">START RACE</button>

    </div>

</body>
</html>
